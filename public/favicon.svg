<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="loraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#loraGrad)" />

  <!-- Radiating Radio Waves (LoRa Chirp Spread Spectrum Symbol) -->
  <!-- Outer Radio Wave Arc -->
  <path d="M14 24 C 23 15, 41 15, 50 24" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />

  <!-- Middle Radio Wave Arc -->
  <path d="M21 32 C 27 26, 37 26, 43 32" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />

  <!-- Inner Radio Wave Arc -->
  <path d="M27 40 C 30 37, 34 37, 37 40" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

  <!-- Central Transmitter Node -->
  <circle cx="32" cy="48" r="4.5" fill="#ffffff" />
</svg>
